<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaise & Scott BBCode Tool</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #0b0d12, #1a1f2e);
  color: #e0e6ff;
}
.container {
  max-width: 1400px;
  width: 95%;
  margin: 0 auto;
  padding: 20px;
}
 .pages {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid #1f2a3a;
}
.pageTab {
  padding: 10px 16px;
  background: transparent;
  border: 1px solid #2a3a4a;
  border-radius: 12px;
  cursor: pointer;
  color: #a0a8c4;
  font-weight: 600;
  transition: all 0.3s ease;
}
.pageTab:hover {
  background: #1f2a3a;
  color: #e0e6ff;
}
.pageTab.active {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  border-color: #4f7cff;
  color: #fff;
}
.pageCard {
  animation: fadeIn 0.4s ease-out;
}
.tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  border-bottom: 1px solid #1f2a3a;
  padding-bottom: 16px;
  animation: slideDown 0.4s ease-out;
}
@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.tab {
  padding: 10px 18px;
  background: transparent;
  border: 1px solid #2a3a4a;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #a0a8c4;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.tab:hover {
  background: #1f2a3a;
  transform: translateY(-2px);
  border-color: #3a4a5a;
}
.tab.active {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: #fff;
  border-color: #4f7cff;
  box-shadow: 0 4px 16px rgba(79, 124, 255, 0.2);
  transform: translateY(-2px);
}
.tab i {
  transition: transform 0.3s ease;
}
.tab.active i {
  transform: scale(1.1);
}
.card {
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
  animation: fadeIn 0.5s ease-out;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.builderGrid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
  animation: slideUp 0.5s ease-out;
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.templateList {
  display: flex;
  flex-direction: column;
  gap: 0;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  padding: 20px;
  height: fit-content;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}
.templateList:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
.templateList h3 {
  margin: 0 0 16px 0;
  color: #e0e6ff;
  font-size: 1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.templateList h3 i {
  width: 18px;
  height: 18px;
  color: #4f7cff;
}
.templateList button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: #a0a8c4;
  border: 1px solid transparent;
  padding: 12px 16px;
  border-radius: 10px;
  transition: all 0.3s ease;
  margin-bottom: 8px;
  font-size: 0.95rem;
  height: 40px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  cursor: pointer;
}
.templateList button:hover {
  background: rgba(79, 124, 255, 0.12);
  color: #e0e6ff;
  border-color: rgba(79, 124, 255, 0.35);
}
.templateList button:hover i {
  color: #4f7cff;
}
.templateList button.selected {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 24px rgba(79, 124, 255, 0.25);
}
.templateList button i {
  width: 18px;
  height: 18px;
  transition: color 0.3s ease;
  flex-shrink: 0;
}
input,
textarea,
select {
  width: 100%;
  box-sizing: border-box;
  background: #0f1419;
  color: #e0e6ff;
  border: 1px solid #1a2530;
  border-radius: 10px;
  padding: 12px 14px;
  transition: all 0.3s ease;
  font-family: inherit;
  font-size: 0.95rem;
}
input::placeholder,
textarea::placeholder {
  color: #5a6a7a;
}
input:hover,
textarea:hover,
select:hover {
  border-color: #2a3a4a;
  box-shadow: 0 2px 8px rgba(79, 124, 255, 0.05);
}
input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #4f7cff;
  background: #0f1419;
  box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
  transform: translateY(-1px);
}
textarea {
  min-height: 180px;
  resize: vertical;
}
.field {
  margin-bottom: 18px;
  animation: slideUp 0.5s ease-out;
}
.field label {
  display: block;
  margin-bottom: 8px;
  color: #a0a8c4;
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: color 0.3s ease;
}
.field:focus-within label {
  color: #4f7cff;
}
.fieldsContainer {
  width: 100%;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
  animation: slideUp 0.5s ease-out 0.1s both;
}
.fieldsContainer:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
#output {
  min-height: 360px;
  margin-top: 0;
  font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
  background: #0f1419;
  border: none;
  border-radius: 0;
  padding: 20px;
  color: #e0e6ff;
  font-size: 0.95rem;
  line-height: 1.6;
  transition: all 0.3s ease;
}
#output:hover {
  background: #0f1419;
}
.outputContainer {
  width: 100%;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  margin-top: 30px;
  overflow: hidden;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.5s ease-out 0.15s both;
  transition: all 0.3s ease;
}
.outputContainer:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
.outputHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #1a2530;
  color: #e0e6ff;
  font-weight: 700;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, rgba(79, 124, 255, 0.05), transparent);
}
.sectionHeader {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  color: #e0e6ff;
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sectionHeader i {
  color: #4f7cff;
  width: 18px;
  height: 18px;
}
button {
  margin-top: 0;
  margin-right: 0;
  padding: 11px 18px;
  border: none;
  border-radius: 10px;
  background: #4f7cff;
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}
button:active::before {
  width: 300px;
  height: 300px;
}
button:hover {
  background: linear-gradient(135deg, #6a8cff, #7a9cff);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(79, 124, 255, 0.3);
}
button:active {
  transform: translateY(-1px);
}
button i {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
}
button:hover i {
  transform: scale(1.15);
}
button.small {
  background: #1a2530;
  color: #e0e6ff;
  height: auto;
  padding: 9px 14px;
  font-size: 0.9rem;
}
button.small:hover {
  background: #2a3a4a;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(79, 124, 255, 0.15);
}
button.small i {
  width: 16px;
  height: 16px;
}
#copyButton, #copyButtonHeader {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  box-shadow: 0 0 20px rgba(79, 124, 255, 0.25);
}
#copyButton:hover, #copyButtonHeader:hover {
  box-shadow: 0 12px 32px rgba(79, 124, 255, 0.4);
}
.buttonGroup {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  align-items: center;
  animation: slideUp 0.5s ease-out 0.2s both;
}
.date-input {
  cursor: pointer;
}
.datePicker {
  position: absolute;
  background: #0f1419;
  color: #e0e6ff;
  border: 1px solid #1a2530;
  border-radius: 12px;
  padding: 14px;
  z-index: 1000;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  width: 270px;
  animation: scaleIn 0.3s ease-out;
}
@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.datePicker.hidden {
  display: none;
}
.datePickerHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.datePickerHeader button {
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  background: #1a2530;
  color: #e0e6ff;
  cursor: pointer;
  transition: all 0.3s ease;
}
.datePickerHeader button:hover {
  background: #2a3a4a;
  transform: scale(1.05);
}
.datePickerHeader div {
  font-weight: 600;
  font-size: 0.95rem;
}
.datePickerGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.datePickerWeekday {
  font-size: 0.75rem;
  color: #5a6a7a;
  text-align: center;
  font-weight: 500;
}
.datePickerGrid button {
  border: none;
  border-radius: 8px;
  background: #1a2530;
  color: #e0e6ff;
  padding: 8px 0;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.85rem;
}
.datePickerGrid button:hover {
  background: #2a3a4a;
  transform: scale(1.05);
}
.datePickerGrid button.selected {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: #fff;
  box-shadow: 0 4px 12px rgba(79, 124, 255, 0.3);
}
.exhibitBox {
  border: 1px solid #1a2530;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
  background: #0a0f15;
  transition: all 0.3s ease;
  display: block;
  animation: slideUp 0.4s ease-out;
}
.exhibitBox:hover {
  border-color: #2a3a4a;
  background: #0f1419;
  box-shadow: 0 4px 12px rgba(79, 124, 255, 0.1);
}
.exhibitBox > strong {
  display: block;
  margin-bottom: 12px;
  color: #e0e6ff;
}
.exhibitBox .exhibit-field {
  margin-bottom: 12px;
}
.exhibitBox .exhibit-field label {
  display: block;
  margin-bottom: 6px;
  color: #a0a8c4;
  font-size: 0.8rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.exhibitBox input,
.exhibitBox textarea {
  width: 100%;
  box-sizing: border-box;
}
.exhibitBox .exhibit-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.exhibitBox button {
  flex: 1;
  height: 36px;
  padding: 0 10px;
}
.hidden {
  display: none;
}
@media (max-width: 950px) {
  .builderGrid {
    grid-template-columns: 1fr;
  }
  .pages,
  .tabs {
    flex-wrap: wrap;
  }
}

[data-lucide] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  stroke-width: 2;
}
h3 {
  color: #e0e6ff;
  margin: 0 0 16px 0;
  font-size: 1.05rem;
}
label {
  color: #a0a8c4;
  font-size: 0.85rem;
  font-weight: 500;
}
select {
  cursor: pointer;
}
select option {
  background: #0f1419;
  color: #e0e6ff;
}

.recordGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px 16px;
}
.recordList { margin-top: 18px; display: grid; gap: 10px; }
.recordItem { border: 1px solid #1f2a3a; border-radius: 12px; padding: 12px; background: #0a1016; }
.recordHeader { display:flex; justify-content: space-between; gap: 8px; font-weight: 600; color:#e0e6ff; margin-bottom:6px; }
.recordMeta { color:#a0a8c4; font-size: .9rem; white-space: pre-wrap; }

</style>
</head>
<body>
<div class="container">

<div class="pages">
  <div class="pageTab active" onclick="switchPage('templates')">Templates</div>
  <div class="pageTab" onclick="switchPage('hr')">HR</div>
  <div class="pageTab" onclick="switchPage('clients')">Clients</div>
  <div class="pageTab" onclick="switchPage('cases')">Cases</div>
</div>

<div id="page_templates" class="pageCard">
<div class="tabs">
  <div class="tab active" onclick="switchTab('builder')"><i data-lucide="wrench"></i>Builder</div>
  <div class="tab" onclick="switchTab('settings')"><i data-lucide="settings"></i>Settings</div>
  <div class="tab" onclick="switchTab('drafts')"><i data-lucide="file-text"></i>Drafts</div>
</div>

<div id="builder" class="card">
  <div class="builderGrid">
    <div class="templateList">
      <h3><i data-lucide="layers"></i>Templates</h3>
      <button id="btn_outreach" class="selected" onclick="setTemplate('outreach')"><i data-lucide="mail"></i>Client Outreach</button>
      <button id="btn_notice" onclick="setTemplate('notice')"><i data-lucide="alert-circle"></i>Notice of Counsel</button>
      <button id="btn_suppress" onclick="setTemplate('suppress')"><i data-lucide="ban"></i>Motion to Suppress</button>
      <button id="btn_compel" onclick="setTemplate('compel')"><i data-lucide="send"></i>Motion to Compel Discovery</button>
    </div>

    <div>
      <div class="fieldsContainer">
        <div class="sectionHeader"><i data-lucide="input"></i>Input Fields</div>
        
        <div id="commonWhoTo" class="field">
        <label>Who To</label>
        <input id="whoTo" placeholder="Enter name or title...">
      </div>

      <div id="outreachFields">
        <label>Message</label>
        <textarea id="outreachMessage"></textarea>
      </div>

      <div id="noticeFields" class="hidden">
        <div class="field"><label>Date</label><input class="date-input" id="noticeDate" readonly placeholder="Select date"></div>
        <div class="field"><label>Defendant Name</label><input id="noticeDefendant" placeholder="Enter defendant name..."></div>
        <div class="field"><label>Counsel Role</label><select id="noticeRole"><option>Primary Counsel</option><option>Co-Counsel</option></select></div>
      </div>

      <div id="suppressFields" class="hidden">
        <div class="field"><label>Case Number</label><input id="suppressCase" placeholder="00-CM-0000"></div>
        <div class="field"><label>Date</label><input class="date-input" id="suppressDate" readonly placeholder="Select date"></div>
        <div class="field"><label>Defendant Name</label><input id="suppressDefendant" placeholder="Enter defendant name..."></div>
        <h3>Exhibits</h3>
        <div id="exhibits"></div>
        <button class="small" onclick="addExhibit()"><i data-lucide="plus"></i>Add Exhibit</button>
      </div>

      <div id="compelFields" class="hidden">
        <div class="field"><label>Case Number</label><input id="compelCase" placeholder="00-CM-0000"></div>
        <div class="field"><label>Date</label><input class="date-input" id="compelDate" readonly placeholder="Select date"></div>
        <div class="field"><label>Defendant Name</label><input id="compelDefendant" placeholder="Enter defendant name..."></div>
        <div class="field"><label>Reasoning</label>
        <textarea id="compelReasoning" placeholder="Discovery has not been provided in a timely manner. This motion is submitted to avoid infringing upon the defendant's right to a speedy trial and to ensure the efficient progression of the case."></textarea></div>
      </div>

      <div class="buttonGroup">
        <button onclick="clearForm()" class="small"><i data-lucide="trash-2"></i>Clear</button>
        <button onclick="saveDraft()" class="small"><i data-lucide="save"></i>Save Draft</button>
        <button id="copyButton" onclick="copyOutput()"><i data-lucide="copy"></i>Copy BBCode</button>
      </div>
      </div>

      <div class="outputContainer">
        <div class="outputHeader">
          <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="code"></i>Output (BBCode)</div>
          <button id="copyButtonHeader" onclick="copyOutput()" class="small" style="margin-right: 0;"><i data-lucide="copy"></i>Copy</button>
        </div>
        <textarea id="output" readonly style="border-radius: 0; border: none; margin: 0;"></textarea>
      </div>
    </div>
  </div>
</div>

<div id="settings" class="card" style="display:none;">
  <label>Name</label><input id="set_name" placeholder="Levy Gold">
  <label>Title</label><input id="set_title" placeholder="Interim Executive Partner">
  <label>Phone</label><input id="set_phone" placeholder="590-2182">
  <label>Signature Image URL</label><input id="set_sig" placeholder="https://i.ibb.co/xqtjm9GX/Hristo-Tsanev-Signature-transparent.png">
  <button onclick="saveSettings()"><i data-lucide="check-circle"></i>Save Settings</button>
</div>

<div id="drafts" class="card" style="display:none;">
  <div id="draftList"></div>
</div>

</div>

<div id="page_hr" class="pageCard" style="display:none;">
  <div class="fieldsContainer">
    <div class="sectionHeader"><i data-lucide="users"></i>HR</div>
    <div class="recordGrid">
      <div class="field"><label>Personnel Name</label><input id="hr_name" placeholder="Jane Doe"></div>
      <div class="field"><label>Role</label><input id="hr_reviews" placeholder="Paralegal"></div>
      <div class="field"><label>Phone</label><input id="hr_disciplinary" placeholder="555-0123"></div>
      <div class="field"><label>Notes</label><textarea id="hr_training" placeholder="Personnel notes..."></textarea></div>
    </div>
    <div class="buttonGroup"><button onclick="saveHrRecord()"><i data-lucide="save"></i>Save Personnel File</button></div>
    <div id="hr_list" class="recordList"></div>
  </div>
</div>

<div id="page_clients" class="pageCard" style="display:none;">
  <div class="fieldsContainer">
    <div class="sectionHeader"><i data-lucide="briefcase"></i>Clients</div>
    <div class="recordGrid">
      <div class="field"><label>Client Name</label><input id="client_name" placeholder="Client Name"></div>
      <div class="field"><label>Phone</label><input id="client_phone" placeholder="555-0100"></div>
      <div class="field"><label>Active Cases</label><input id="client_active_cases" placeholder="Case numbers or count"></div>
      <div class="field"><label>Notes</label><textarea id="client_notes" placeholder="Client notes..."></textarea></div>
    </div>
    <div class="buttonGroup"><button onclick="saveClientRecord()"><i data-lucide="save"></i>Save Client</button></div>
    <div id="client_list" class="recordList"></div>
  </div>
</div>

<div id="page_cases" class="pageCard" style="display:none;">
  <div class="fieldsContainer">
    <div class="sectionHeader"><i data-lucide="folder-open"></i>Cases</div>
    <div class="recordGrid">
      <div class="field"><label>Case Number</label><input id="case_number" placeholder="00-CM-0000"></div>
      <div class="field"><label>Client</label><input id="case_client" placeholder="Client Name"></div>
      <div class="field"><label>Charges</label><textarea id="case_charges" placeholder="Charge details..."></textarea></div>
      <div class="field"><label>Status</label><input id="case_status" placeholder="Open / Closed / Pending"></div>
      <div class="field"><label>Outcome</label><input id="case_outcome" placeholder="Outcome"></div>
      <div class="field"><label>Notes</label><textarea id="case_notes" placeholder="Case notes..."></textarea></div>
    </div>
    <div class="buttonGroup"><button onclick="saveCaseRecord()"><i data-lucide="save"></i>Save Case</button></div>
    <div id="case_list" class="recordList"></div>
  </div>
</div>

<div id="datePicker" class="datePicker hidden">
  <div class="datePickerHeader">
    <button type="button" id="prevMonth">‹</button>
    <div id="datePickerMonth"></div>
    <button type="button" id="nextMonth">›</button>
  </div>
  <div class="datePickerGrid" id="datePickerGrid"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

function switchPage(page) {
  document.querySelectorAll('.pageTab').forEach(t => t.classList.remove('active'));
  const order = ['templates', 'hr', 'clients', 'cases'];
  document.querySelectorAll('.pageTab')[order.indexOf(page)].classList.add('active');

    const section = document.getElementById('page_' + name);
    section.style.display = name === page ? 'block' : 'none';

}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tab === 'builder') document.querySelectorAll('.tab')[0].classList.add('active');
  if (tab === 'settings') document.querySelectorAll('.tab')[1].classList.add('active');

function normaliseDate(value) {
  const trimmed = value.trim();
  if (!trimmed) return '';
  const parsed = new Date(trimmed);
  if (!isNaN(parsed.getTime())) {
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const day = String(parsed.getDate()).padStart(2, '0');
    const month = months[parsed.getMonth()];
    return `${day}/${month}/${parsed.getFullYear()}`;
  }
  return trimmed.replace(/\/([a-z]{3})\//i, function(match, month) {
    return '/' + month.toUpperCase() + '/';
  });
}

const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let datePickerState = { viewDate: new Date() };
let activeDateInput = null;

function openDatePicker(input) {
  activeDateInput = input;
  const selected = input.value ? new Date(input.value) : new Date();
  datePickerState.viewDate = isNaN(selected.getTime()) ? new Date() : new Date(selected.getFullYear(), selected.getMonth(), 1);
  renderDatePicker();
  const rect = input.getBoundingClientRect();
  const picker = document.getElementById('datePicker');
  picker.style.top = `${window.scrollY + rect.bottom + 8}px`;
  picker.style.left = `${window.scrollX + rect.left}px`;
  picker.classList.remove('hidden');
}

function renderDatePicker() {
  const monthLabel = document.getElementById('datePickerMonth');
  const grid = document.getElementById('datePickerGrid');
  monthLabel.textContent = `${monthNames[datePickerState.viewDate.getMonth()]} ${datePickerState.viewDate.getFullYear()}`;
  grid.innerHTML = '';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(day => {
    const label = document.createElement('div');
    label.className = 'datePickerWeekday';
    label.textContent = day;
    grid.appendChild(label);
  });
  const firstDayOfMonth = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth(), 1).getDay();
  for (let i = 0; i < firstDayOfMonth; i++) {
    grid.appendChild(document.createElement('div'));
  }
  const daysInMonth = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth() + 1, 0).getDate();
  const selectedDate = activeDateInput && activeDateInput.value ? new Date(activeDateInput.value) : null;
  for (let day = 1; day <= daysInMonth; day++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = day;
    if (selectedDate && selectedDate.getFullYear() === datePickerState.viewDate.getFullYear() && selectedDate.getMonth() === datePickerState.viewDate.getMonth() && selectedDate.getDate() === day) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', () => selectDate(day));
    grid.appendChild(btn);
  }
}

function selectDate(day) {
  const date = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth(), day);
  activeDateInput.value = formatDateInputValue(date);
  activeDateInput.dispatchEvent(new Event('input', { bubbles: true }));
  document.getElementById('datePicker').classList.add('hidden');
}

function changeMonth(amount) {
  datePickerState.viewDate = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth() + amount, 1);
  renderDatePicker();
}

function formatDateInputValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setupDatePicker() {
  document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
  document.addEventListener('click', event => {
    const picker = document.getElementById('datePicker');
    if (!picker.contains(event.target) && !event.target.classList.contains('date-input')) {
      picker.classList.add('hidden');
    }
  });
  document.querySelectorAll('.date-input').forEach(input => {
    input.addEventListener('focus', () => openDatePicker(input));
    input.addEventListener('click', () => openDatePicker(input));
  });
}

    const num = box.querySelector('.exhibitNum').value.trim();
    const name = box.querySelector('.exhibitName').value.trim();
    const suppress = box.querySelector('.exhibitSuppress').value.trim();
    const reason = box.querySelector('.exhibitReason').value.trim();
    exhibitText += `\n[list=none]
Exhibit ${num}: [i]${name}[/i]
[b]Requested Evidence to Suppress:[/b][quote]
${suppress}
[/quote]
[list=none][b]Detailed Reasoning:[/b] ${reason}
[/list][/list]\n`;
  });

  return `[b]To whom it may concern,[/b]

[hr][/hr]
[center][b][size=125]MOTION TO SUPPRESS[/size][/b][/center]
[hr][/hr]

[center][font=Arial]IN THE SUPERIOR COURT OF SAN ANDREAS

#${caseNo}

A Motion to Suppress was filed in the above case on ${date}.
[/center]

Defendant, ${defendant}, by and through counsel of record, submits this Motion to Suppress and respectfully moves this Court to suppress the following evidence.

${exhibitText}`;
}

function generate() {
  let body = '';
  if (currentTemplate === 'outreach') body = buildOutreach();
  if (currentTemplate === 'notice') body = buildNotice();
  if (currentTemplate === 'suppress') body = buildSuppress();
  if (currentTemplate === 'compel') body = buildCompel();
  document.getElementById('output').value = baseTemplate(body);
}

function copyOutput(){
  const out = document.getElementById('output');
  const button = document.getElementById('copyButton');
  const originalText = button.textContent;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    button.textContent = 'Copied!';
    setTimeout(() => button.textContent = originalText, 1500);
  }).catch(() => {
    button.textContent = 'Copy Failed';
    setTimeout(() => button.textContent = originalText, 1500);
  });
}

function saveDraft(){

}

function loadDrafts(){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  const list = document.getElementById('draftList');
  list.innerHTML = '';
  drafts.forEach((d,i) => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<button onclick="loadDraft(${i})">Load Draft ${i+1} - ${d.template} - ${d.savedAt}</button> <button class="small" onclick="deleteDraft(${i})">Delete</button>`;
    list.appendChild(wrap);
  });
}

function loadDraft(i){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  document.getElementById('output').value = drafts[i].output;
  switchTab('builder');
}

function deleteDraft(i){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  drafts.splice(i,1);
  localStorage.setItem('drafts', JSON.stringify(drafts));
  loadDrafts();
}

function getRecords(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
function setRecords(key, rows) { localStorage.setItem(key, JSON.stringify(rows)); }
function renderRecordList(key, listId, formatter) {
  const list = document.getElementById(listId);
  const rows = getRecords(key);
  list.innerHTML = '';
  rows.forEach((row, i) => {
    const el = document.createElement('div');
    el.className = 'recordItem';
    el.innerHTML = `<div class="recordHeader"><span>${formatter.title(row)}</span><button class="small" onclick="deleteRecord('${key}', ${i}, '${listId}', '${formatter.name}')">Delete</button></div><div class="recordMeta">${formatter.body(row)}</div>`;
    list.appendChild(el);
  });
}
const formatters = {
  hr: { name: 'hr', title: r => r.name || 'Unnamed Personnel File', body: r => `Role: ${r.role || '-'}\nPhone: ${r.phone || '-'}\nNotes: ${r.notes || '-'}` },
  client: { name: 'client', title: r => r.name || 'Unnamed Client', body: r => `Phone: ${r.phone || '-'}\nActive Cases: ${r.activeCases || '-'}\nNotes: ${r.notes || '-'}` },
  case: { name: 'case', title: r => r.caseNumber || 'Unnamed Case', body: r => `Client: ${r.client || '-'}\nCharges: ${r.charges || '-'}\nStatus: ${r.status || '-'}\nOutcome: ${r.outcome || '-'}\nNotes: ${r.notes || '-'}` }
};
function deleteRecord(key, i, listId, formatterName) {
  const rows = getRecords(key); rows.splice(i, 1); setRecords(key, rows);
  renderRecordList(key, listId, formatters[formatterName]);
}
function renderHrList() {
  const list = document.getElementById('hr_list');
  list.innerHTML = '';
  hrPersonnel.forEach((row) => {
    const el = document.createElement('div');
    el.className = 'recordItem';
    el.innerHTML = `<div class="recordHeader"><span>${formatters.hr.title(row)}</span><div><button class="small" onclick="editHrRecord('${row.id}')">Edit</button> <button class="small" onclick="deleteHrRecord('${row.id}')">Delete</button></div></div><div class="recordMeta">${formatters.hr.body(row)}</div>`;
    list.appendChild(el);
  });
}

async function saveHrRecord() {
  const name = hr_name.value.trim();
  const role = hr_reviews.value.trim();
  const phone = hr_disciplinary.value.trim();
  const notes = hr_training.value.trim();
  await addDoc(collection(db, 'personnel'), {
    name,
    role,
    phone,
    notes,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
  hr_name.value = '';
  hr_reviews.value = '';
  hr_disciplinary.value = '';
  hr_training.value = '';
}

async function editHrRecord(id) {
  const current = hrPersonnel.find(p => p.id === id);
  if (!current) return;
  const name = prompt('Name', current.name || '');
  if (name === null) return;
  const role = prompt('Role', current.role || '');
  if (role === null) return;
  const phone = prompt('Phone', current.phone || '');
  if (phone === null) return;
  const notes = prompt('Notes', current.notes || '');
  if (notes === null) return;
  await updateDoc(doc(db, 'personnel', id), { name: name.trim(), role: role.trim(), phone: phone.trim(), notes: notes.trim(), updatedAt: serverTimestamp() });
}

async function deleteHrRecord(id) {
  await deleteDoc(doc(db, 'personnel', id));
}

function subscribePersonnel() {
  onSnapshot(collection(db, 'personnel'), (snapshot) => {
    hrPersonnel = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderHrList();
  });
}
function saveClientRecord() {
  const rows = getRecords('clientRecords');
  rows.push({ name: client_name.value.trim(), phone: client_phone.value.trim(), activeCases: client_active_cases.value.trim(), notes: client_notes.value.trim() });
  setRecords('clientRecords', rows);
  renderRecordList('clientRecords', 'client_list', formatters.client);
}
function saveCaseRecord() {
  const rows = getRecords('caseRecords');
  rows.push({ caseNumber: case_number.value.trim(), client: case_client.value.trim(), charges: case_charges.value.trim(), status: case_status.value.trim(), outcome: case_outcome.value.trim(), notes: case_notes.value.trim() });
  setRecords('caseRecords', rows);
  renderRecordList('caseRecords', 'case_list', formatters.case);
}
