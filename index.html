<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaise & Scott BBCode Tool</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #0b0d12, #1a1f2e);
  color: #e0e6ff;
}
.container {
  max-width: 1400px;
  width: 95%;
  margin: 0 auto;
  padding: 20px;
}
 .pages {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid #1f2a3a;
}
.pageTab {
  padding: 10px 16px;
  background: transparent;
  border: 1px solid #2a3a4a;
  border-radius: 12px;
  cursor: pointer;
  color: #a0a8c4;
  font-weight: 600;
  transition: all 0.3s ease;
}
.pageTab:hover {
  background: #1f2a3a;
  color: #e0e6ff;
}
.pageTab.active {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  border-color: #4f7cff;
  color: #fff;
}
.pageCard {
  animation: fadeIn 0.4s ease-out;
}
.tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  border-bottom: 1px solid #1f2a3a;
  padding-bottom: 16px;
  animation: slideDown 0.4s ease-out;
}
@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.tab {
  padding: 10px 18px;
  background: transparent;
  border: 1px solid #2a3a4a;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #a0a8c4;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.tab:hover {
  background: #1f2a3a;
  transform: translateY(-2px);
  border-color: #3a4a5a;
}
.tab.active {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: #fff;
  border-color: #4f7cff;
  box-shadow: 0 4px 16px rgba(79, 124, 255, 0.2);
  transform: translateY(-2px);
}
.tab i {
  transition: transform 0.3s ease;
}
.tab.active i {
  transform: scale(1.1);
}
.card {
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
  animation: fadeIn 0.5s ease-out;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.builderGrid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
  animation: slideUp 0.5s ease-out;
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.templateList {
  display: flex;
  flex-direction: column;
  gap: 0;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  padding: 20px;
  height: fit-content;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}
.templateList:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
.templateList h3 {
  margin: 0 0 16px 0;
  color: #e0e6ff;
  font-size: 1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.templateList h3 i {
  width: 18px;
  height: 18px;
  color: #4f7cff;
}
.templateList button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: #a0a8c4;
  border: 1px solid transparent;
  padding: 12px 16px;
  border-radius: 10px;
  transition: all 0.3s ease;
  margin-bottom: 8px;
  font-size: 0.95rem;
  height: 40px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  cursor: pointer;
}
.templateList button:hover {
  background: rgba(79, 124, 255, 0.12);
  color: #e0e6ff;
  border-color: rgba(79, 124, 255, 0.35);
}
.templateList button:hover i {
  color: #4f7cff;
}
.templateList button.selected {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 24px rgba(79, 124, 255, 0.25);
}
.templateList button i {
  width: 18px;
  height: 18px;
  transition: color 0.3s ease;
  flex-shrink: 0;
}
input,
textarea,
select {
  width: 100%;
  box-sizing: border-box;
  background: #0f1419;
  color: #e0e6ff;
  border: 1px solid #1a2530;
  border-radius: 10px;
  padding: 12px 14px;
  transition: all 0.3s ease;
  font-family: inherit;
  font-size: 0.95rem;
}
input::placeholder,
textarea::placeholder {
  color: #5a6a7a;
}
input:hover,
textarea:hover,
select:hover {
  border-color: #2a3a4a;
  box-shadow: 0 2px 8px rgba(79, 124, 255, 0.05);
}
input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #4f7cff;
  background: #0f1419;
  box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
  transform: translateY(-1px);
}
textarea {
  min-height: 180px;
  resize: vertical;
}
.field {
  margin-bottom: 18px;
  animation: slideUp 0.5s ease-out;
}
.field label {
  display: block;
  margin-bottom: 8px;
  color: #a0a8c4;
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: color 0.3s ease;
}
.field:focus-within label {
  color: #4f7cff;
}
.fieldsContainer {
  width: 100%;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
  animation: slideUp 0.5s ease-out 0.1s both;
}
.fieldsContainer:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
#output {
  min-height: 360px;
  margin-top: 0;
  font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
  background: #0f1419;
  border: none;
  border-radius: 0;
  padding: 20px;
  color: #e0e6ff;
  font-size: 0.95rem;
  line-height: 1.6;
  transition: all 0.3s ease;
}
#output:hover {
  background: #0f1419;
}
.outputContainer {
  width: 100%;
  background: #0f1419;
  border: 1px solid #1a2530;
  border-radius: 16px;
  margin-top: 30px;
  overflow: hidden;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.5s ease-out 0.15s both;
  transition: all 0.3s ease;
}
.outputContainer:hover {
  border-color: #2a3a4a;
  box-shadow: 0 8px 30px rgba(79, 124, 255, 0.1);
}
.outputHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #1a2530;
  color: #e0e6ff;
  font-weight: 700;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, rgba(79, 124, 255, 0.05), transparent);
}
.sectionHeader {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  color: #e0e6ff;
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sectionHeader i {
  color: #4f7cff;
  width: 18px;
  height: 18px;
}
button {
  margin-top: 0;
  margin-right: 0;
  padding: 11px 18px;
  border: none;
  border-radius: 10px;
  background: #4f7cff;
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}
button:active::before {
  width: 300px;
  height: 300px;
}
button:hover {
  background: linear-gradient(135deg, #6a8cff, #7a9cff);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(79, 124, 255, 0.3);
}
button:active {
  transform: translateY(-1px);
}
button i {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
}
button:hover i {
  transform: scale(1.15);
}
button.small {
  background: #1a2530;
  color: #e0e6ff;
  height: auto;
  padding: 9px 14px;
  font-size: 0.9rem;
}
button.small:hover {
  background: #2a3a4a;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(79, 124, 255, 0.15);
}
button.small i {
  width: 16px;
  height: 16px;
}
#copyButton, #copyButtonHeader {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  box-shadow: 0 0 20px rgba(79, 124, 255, 0.25);
}
#copyButton:hover, #copyButtonHeader:hover {
  box-shadow: 0 12px 32px rgba(79, 124, 255, 0.4);
}
.buttonGroup {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  align-items: center;
  animation: slideUp 0.5s ease-out 0.2s both;
}
.date-input {
  cursor: pointer;
}
.datePicker {
  position: absolute;
  background: #0f1419;
  color: #e0e6ff;
  border: 1px solid #1a2530;
  border-radius: 12px;
  padding: 14px;
  z-index: 1000;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  width: 270px;
  animation: scaleIn 0.3s ease-out;
}
@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.datePicker.hidden {
  display: none;
}
.datePickerHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.datePickerHeader button {
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  background: #1a2530;
  color: #e0e6ff;
  cursor: pointer;
  transition: all 0.3s ease;
}
.datePickerHeader button:hover {
  background: #2a3a4a;
  transform: scale(1.05);
}
.datePickerHeader div {
  font-weight: 600;
  font-size: 0.95rem;
}
.datePickerGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.datePickerWeekday {
  font-size: 0.75rem;
  color: #5a6a7a;
  text-align: center;
  font-weight: 500;
}
.datePickerGrid button {
  border: none;
  border-radius: 8px;
  background: #1a2530;
  color: #e0e6ff;
  padding: 8px 0;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.85rem;
}
.datePickerGrid button:hover {
  background: #2a3a4a;
  transform: scale(1.05);
}
.datePickerGrid button.selected {
  background: linear-gradient(135deg, #4f7cff, #6a8cff);
  color: #fff;
  box-shadow: 0 4px 12px rgba(79, 124, 255, 0.3);
}
.exhibitBox {
  border: 1px solid #1a2530;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
  background: #0a0f15;
  transition: all 0.3s ease;
  display: block;
  animation: slideUp 0.4s ease-out;
}
.exhibitBox:hover {
  border-color: #2a3a4a;
  background: #0f1419;
  box-shadow: 0 4px 12px rgba(79, 124, 255, 0.1);
}
.exhibitBox > strong {
  display: block;
  margin-bottom: 12px;
  color: #e0e6ff;
}
.exhibitBox .exhibit-field {
  margin-bottom: 12px;
}
.exhibitBox .exhibit-field label {
  display: block;
  margin-bottom: 6px;
  color: #a0a8c4;
  font-size: 0.8rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.exhibitBox input,
.exhibitBox textarea {
  width: 100%;
  box-sizing: border-box;
}
.exhibitBox .exhibit-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.exhibitBox button {
  flex: 1;
  height: 36px;
  padding: 0 10px;
}
.hidden {
  display: none;
}
@media (max-width: 950px) {
  .builderGrid {
    grid-template-columns: 1fr;
  }
  .personnelLayout {
    grid-template-columns: 1fr;
  }
  .pages,
  .tabs {
    flex-wrap: wrap;
  }
}

[data-lucide] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  stroke-width: 2;
}
h3 {
  color: #e0e6ff;
  margin: 0 0 16px 0;
  font-size: 1.05rem;
}
label {
  color: #a0a8c4;
  font-size: 0.85rem;
  font-weight: 500;
}
select {
  cursor: pointer;
}
select option {
  background: #0f1419;
  color: #e0e6ff;
}

.recordGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px 16px;
}
.recordList { margin-top: 18px; display: grid; gap: 10px; }
.recordItem { border: 1px solid #1f2a3a; border-radius: 12px; padding: 12px; background: #0a1016; }
.recordHeader { display:flex; justify-content: space-between; gap: 8px; font-weight: 600; color:#e0e6ff; margin-bottom:6px; }
.recordMeta { color:#a0a8c4; font-size: .9rem; white-space: pre-wrap; }
.ongoingCaseRow {
  padding: 0;
  margin-bottom: 8px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
  transform-origin: center;
}
.ongoingCaseRow .recordHeader {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
  gap: 10px;
}
.ongoingCaseRow .recordMeta {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  padding: 0 12px;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: max-height 0.24s ease, opacity 0.2s ease, padding 0.2s ease;
}
.ongoingCaseRow.expanded .recordMeta {
  max-height: 480px;
  opacity: 1;
  padding: 8px 12px 10px;
}
.ongoingCaseDetails {
  display: grid;
  gap: 4px;
}
.ongoingCaseDetailRow {
  color: #a0a8c4;
}
.ongoingCaseFooter {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #1f2a3a;
  display: flex;
  justify-content: flex-end;
}
.ongoingCaseActions {
  display: flex;
  gap: 8px;
}
.ongoingCaseActions .small {
  min-width: 88px;
  justify-content: center;
}
.ongoingCaseActions .danger {
  background: rgba(239, 68, 68, 0.18);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: #fecaca;
}
.ongoingCaseActions .danger:hover {
  background: rgba(239, 68, 68, 0.32);
  box-shadow: 0 6px 16px rgba(239, 68, 68, 0.2);
}
.ongoingCaseRow:hover {
  transform: translateY(-2px) scale(1.008);
  border-color: #2a3a4a;
  background: #0f1419;
  box-shadow: 0 10px 24px rgba(79, 124, 255, 0.12);
}
.ongoingCaseTitle {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ongoingCaseStatus {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #cbd5e1;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.statusDot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.chargeSelector {
  margin-top: 8px;
}
.chargeSearch {
  margin-bottom: 8px;
}
.chargeModifiers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.chargeModifier {
  width: 100%;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid #2a3a4a;
  background: #0f1419;
  color: #a0a8c4;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.chargeModifier.active {
  background: rgba(79, 124, 255, 0.18);
  border-color: rgba(79, 124, 255, 0.5);
  color: #e0e6ff;
}
.chargeList {
  max-height: 280px;
  overflow: auto;
  border: 1px solid #1a2530;
  border-radius: 10px;
  padding: 8px;
  background: #0a1016;
}
.chargeGroup {
  margin-bottom: 10px;
}
.chargeGroup:last-child {
  margin-bottom: 0;
}
.chargeGroupHeader {
  font-size: 0.72rem;
  color: #64748b;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 2px 0 6px;
}
.chargeOption {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  color: #cbd5e1;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 6px 8px;
  margin-bottom: 4px;
  cursor: pointer;
}
.chargeOption:hover {
  background: rgba(79, 124, 255, 0.1);
  border-color: rgba(79, 124, 255, 0.3);
}
.chargeOption.active {
  background: rgba(79, 124, 255, 0.18);
  border-color: rgba(79, 124, 255, 0.38);
}
.chargeCode, .chargeName {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chargeCode {
  width: 70px;
  flex-shrink: 0;
  color: #93c5fd;
  font-weight: 600;
}
.chargeName {
  flex: 1;
}
.chargeCheck {
  opacity: 0;
  color: #60a5fa;
}
.chargeOption.active .chargeCheck {
  opacity: 1;
}
.selectedChargeList {
  margin-top: 10px;
  display: grid;
  gap: 6px;
}
.selectedChargeItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border-radius: 8px;
  background: #101a26;
  border: 1px solid #1f2a3a;
}
.selectedChargeText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.personnelLayout { display:grid; grid-template-columns: 320px 1fr; gap: 16px; }
.personnelListPanel, .personnelDetailPanel { border: 1px solid #1f2a3a; border-radius: 12px; background: #0a1016; padding: 14px; }
.personnelCard { border: 1px solid #1f2a3a; border-radius: 10px; padding: 10px; cursor: pointer; margin-bottom: 8px; }
.personnelCard.active { border-color: #4f7cff; background: rgba(79,124,255,0.12); }
.sectionTabs { display:flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sectionTab { padding: 8px 12px; border: 1px solid #2a3a4a; border-radius: 10px; background: transparent; color:#a0a8c4; cursor:pointer; }
.sectionTab.active { background: linear-gradient(135deg, #4f7cff, #6a8cff); color: white; border-color: #4f7cff; }
.sectionToolbar { display:flex; justify-content: space-between; align-items:center; gap:10px; margin-bottom: 10px; }
.modalBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index: 2000; }
.modalBackdrop.hidden { display: none; }
.modalCard { width: min(760px, 92vw); max-height: 88vh; overflow:auto; background:#0f1419; border:1px solid #2a3a4a; border-radius: 14px; padding: 18px; }
.modalActions { display:flex; justify-content:flex-end; gap: 10px; margin-top: 14px; }

</style>
</head>
<body>
<div class="container">

<div class="pages">
  <div class="pageTab active" onclick="switchPage('templates')">Templates</div>
  <div class="pageTab" onclick="switchPage('hr')">HR</div>
  <div class="pageTab" onclick="switchPage('clients')">Clients</div>
  <div class="pageTab" onclick="switchPage('cases')">Cases</div>
</div>

<div id="page_templates" class="pageCard">
<div class="tabs">
  <div class="tab active" onclick="switchTab('builder')"><i data-lucide="wrench"></i>Builder</div>
  <div class="tab" onclick="switchTab('settings')"><i data-lucide="settings"></i>Settings</div>
  <div class="tab" onclick="switchTab('drafts')"><i data-lucide="file-text"></i>Drafts</div>
</div>

<div id="builder" class="card">
  <div class="builderGrid">
    <div class="templateList">

async function loadPenalCodes() {
  const snapshot = await getDocs(collection(db, "penalCodes"));
  chargesList = snapshot.docs
    .map((docSnap) => {
      const data = docSnap.data() || {};
      return {
        code: String(data.code || '').trim(),
        name: String(data.name || '').trim(),
        category: data.category ? String(data.category).trim() : ''
      };
    })
    .filter((charge) => charge.code && charge.name)
    .sort((a, b) => a.code.localeCompare(b.code));
}

function formatCharge(chargeCode) {
  const match = chargesList.find(c => c.code === chargeCode);
  return match ? `${match.code} - ${match.name}` : chargeCode;
}
function getChargeCategory(code = '') {
  const prefix = (code.match(/^[A-Za-z]+/)?.[0] || 'OTHER').toUpperCase();
  const labels = { VC: 'VEHICLE CODE (VC)', GM: 'GENERAL MISDEMEANOR (GM)', WM: 'WEAPON (WM)' };
  return labels[prefix] || `${prefix} CHARGES (${prefix})`;
}
function chargeSelectionKey(charge) {
  if (typeof charge === 'string') return charge;
  if (!charge || typeof charge !== 'object') return '';
  return `${charge.code || ''}::${(charge.modifiers || []).join('|')}`;
}
function formatChargeWithModifiers(chargeName, modifierIds = []) {
  const active = new Set(modifierIds);
  const prefixes = [];
  if (active.has('accessory')) prefixes.push('Accessory to');
  if (active.has('attempt')) prefixes.push('Attempted');
  if (active.has('aggravated')) prefixes.push('Aggravated');
  const suffix = active.has('govEmployee') ? ' of a Government Employee' : '';
  return `${prefixes.join(' ')}${prefixes.length ? ' ' : ''}${chargeName}${suffix}`;
}
function formatChargeSelection(charge) {
  if (typeof charge === 'string') return formatCharge(charge);
  const base = formatCharge(charge.code || '');
  const [code, ...nameParts] = base.split(' - ');
  const name = nameParts.join(' - ') || code;
  return `${code} - ${formatChargeWithModifiers(name, charge.modifiers || [])}`;
}
function buildChargeCounts(charges = []) {
  return charges.reduce((acc, charge) => {
    const key = chargeSelectionKey(charge);
    acc[key] = acc[key] || { charge, count: 0 };
    acc[key].count += 1;
    return acc;
  }, {});
}
function formatChargeCounts(charges = []) {
  const entries = Object.values(buildChargeCounts(charges));
  if (!entries.length) return 'None';
  return entries.map(({ charge, count }) => `${formatChargeSelection(charge)}${count > 1 ? ` (x${count})` : ''}`).join(', ');
}

function normaliseDate(value) {
  const trimmed = value.trim();
  if (!trimmed) return '';
  const parsed = new Date(trimmed);
  if (!isNaN(parsed.getTime())) {
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const day = String(parsed.getDate()).padStart(2, '0');
    const month = months[parsed.getMonth()];
    return `${day}/${month}/${parsed.getFullYear()}`;
  }
  return trimmed.replace(/\/([a-z]{3})\//i, function(match, month) {
    return '/' + month.toUpperCase() + '/';
  });
}

function getDefaultOutreachMessage() {
  const s = getSettings();

I have reviewed your case on the docket and would like to offer my services as your counsel. You would be represented by me through Blaise & Scott, with the firm overseeing and supporting your defence throughout the matter.

Legal fees are required for representation. Full details regarding fees, billing structure, and any applicable retainer will be discussed transparently prior to engagement and confirmed before any substantive work begins.

Please respond to this email at your earliest convenience so that we can arrange a meeting and determine how you wish to proceed.

Thank you for your time and consideration.`;

const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let datePickerState = { viewDate: new Date() };
let activeDateInput = null;

function openDatePicker(input) {
  activeDateInput = input;
  const selected = input.value ? new Date(input.value) : new Date();
  datePickerState.viewDate = isNaN(selected.getTime()) ? new Date() : new Date(selected.getFullYear(), selected.getMonth(), 1);
  renderDatePicker();
  const rect = input.getBoundingClientRect();
  const picker = document.getElementById('datePicker');
  picker.style.top = `${window.scrollY + rect.bottom + 8}px`;
  picker.style.left = `${window.scrollX + rect.left}px`;
  picker.classList.remove('hidden');
}

function renderDatePicker() {
  const monthLabel = document.getElementById('datePickerMonth');
  const grid = document.getElementById('datePickerGrid');
  monthLabel.textContent = `${monthNames[datePickerState.viewDate.getMonth()]} ${datePickerState.viewDate.getFullYear()}`;
  grid.innerHTML = '';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(day => {
    const label = document.createElement('div');
    label.className = 'datePickerWeekday';
    label.textContent = day;
    grid.appendChild(label);
  });
  const firstDayOfMonth = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth(), 1).getDay();
  for (let i = 0; i < firstDayOfMonth; i++) {
    grid.appendChild(document.createElement('div'));
  }
  const daysInMonth = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth() + 1, 0).getDate();
  const selectedDate = activeDateInput && activeDateInput.value ? new Date(activeDateInput.value) : null;
  for (let day = 1; day <= daysInMonth; day++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = day;
    if (selectedDate && selectedDate.getFullYear() === datePickerState.viewDate.getFullYear() && selectedDate.getMonth() === datePickerState.viewDate.getMonth() && selectedDate.getDate() === day) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', () => selectDate(day));
    grid.appendChild(btn);
  }
}

function selectDate(day) {
  const date = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth(), day);
  activeDateInput.value = formatDateInputValue(date);
  activeDateInput.dispatchEvent(new Event('input', { bubbles: true }));
  document.getElementById('datePicker').classList.add('hidden');
}

function changeMonth(amount) {
  datePickerState.viewDate = new Date(datePickerState.viewDate.getFullYear(), datePickerState.viewDate.getMonth() + amount, 1);
  renderDatePicker();
}

function formatDateInputValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setupDatePicker() {
  document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
  document.addEventListener('click', event => {
    const picker = document.getElementById('datePicker');
    if (!picker.contains(event.target) && !event.target.classList.contains('date-input')) {
      picker.classList.add('hidden');
    }
  });
  document.querySelectorAll('.date-input').forEach(input => {
    input.addEventListener('focus', () => openDatePicker(input));
    input.addEventListener('click', () => openDatePicker(input));
  });
}

function copyOutput(){

  const originalText = button.textContent;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    button.textContent = 'Copied!';
    setTimeout(() => button.textContent = originalText, 1500);
  }).catch(() => {
    button.textContent = 'Copy Failed';

  localStorage.setItem('name', document.getElementById('set_name').value || 'Levy Gold');

  localStorage.setItem('phone', document.getElementById('set_phone').value || '590-2182');
  localStorage.setItem('sig', document.getElementById('set_sig').value || 'https://i.ibb.co/xqtjm9GX/Hristo-Tsanev-Signature-transparent.png');

}

function saveDraft(){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  drafts.push({ template: currentTemplate, output: document.getElementById('output').value, savedAt: new Date().toLocaleString() });
  localStorage.setItem('drafts', JSON.stringify(drafts));
  loadDrafts();
}

function loadDrafts(){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  const list = document.getElementById('draftList');
  list.innerHTML = '';
  drafts.forEach((d,i) => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<button onclick="loadDraft(${i})">Load Draft ${i+1} - ${d.template} - ${d.savedAt}</button> <button class="small" onclick="deleteDraft(${i})">Delete</button>`;
    list.appendChild(wrap);
  });
}

function loadDraft(i){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  document.getElementById('output').value = drafts[i].output;
  switchTab('builder');
}

function deleteDraft(i){
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  drafts.splice(i,1);
  localStorage.setItem('drafts', JSON.stringify(drafts));
  loadDrafts();
}

const hrSections = {
  basicInfo: { label: 'Basic Info', fields: ['title', 'email', 'address', 'emergencyContact', 'notes'] },
  strikes: { label: 'Strikes / Discipline', fields: ['strikeAmount', 'reason', 'issuedBy', 'date', 'notes', 'status'] },
  caseHistory: { label: 'Case History', fields: ['caseNumber', 'roleOnCase', 'outcome', 'winLoss', 'dateClosed', 'notes'] },
  ongoingCases: { label: 'Ongoing Cases', fields: ['caseNumber', 'client', 'charges', 'status', 'assignedAttorney', 'docketLink', 'notes'] },
  performanceReviews: { label: 'Performance Reviews', fields: ['reviewDate', 'reviewer', 'rating', 'strengths', 'issues', 'improvementNotes'] },
  trainingLogs: { label: 'Training Logs', fields: ['trainingName', 'trainer', 'date', 'passFail', 'notes'] }
};

function getRecords(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
function setRecords(key, rows) { localStorage.setItem(key, JSON.stringify(rows)); }
function renderRecordList(key, listId, formatter) {
  const list = document.getElementById(listId);
  const rows = getRecords(key);
  list.innerHTML = '';
  rows.forEach((row, i) => {
    const el = document.createElement('div');
    el.className = 'recordItem';
    el.innerHTML = `<div class="recordHeader"><span>${formatter.title(row)}</span><button class="small" onclick="deleteRecord('${key}', ${i}, '${listId}', '${formatter.name}')">Delete</button></div><div class="recordMeta">${formatter.body(row)}</div>`;
    list.appendChild(el);
  });
}
const formatters = {
  hr: { name: 'hr', title: r => r.name || 'Unnamed Personnel File', body: r => `Role: ${r.role || '-'}\nPhone: ${r.phone || '-'}\nNotes: ${r.notes || '-'}` },
  client: { name: 'client', title: r => r.name || 'Unnamed Client', body: r => `Phone: ${r.phone || '-'}\nActive Cases: ${r.activeCases || '-'}\nNotes: ${r.notes || '-'}` },
  case: { name: 'case', title: r => r.caseNumber || 'Unnamed Case', body: r => `Client: ${r.client || '-'}\nCharges: ${r.charges || '-'}\nStatus: ${r.status || '-'}\nOutcome: ${r.outcome || '-'}\nNotes: ${r.notes || '-'}` }
};
function deleteRecord(key, i, listId, formatterName) {
  const rows = getRecords(key); rows.splice(i, 1); setRecords(key, rows);
  renderRecordList(key, listId, formatters[formatterName]);
}
function renderHrList() {
  const list = document.getElementById('hr_list');
  list.innerHTML = '';
  hrPersonnel.forEach((row) => {
    const el = document.createElement('div');
    el.className = `personnelCard ${selectedPersonnelId === row.id ? 'active' : ''}`;
    el.innerHTML = `<div class="recordHeader"><span>${formatters.hr.title(row)}</span><div><button class="small" onclick="openPersonnelModal('${row.id}')">Edit</button> <button class="small" onclick="deleteHrRecord('${row.id}')">Delete</button></div></div><div class="recordMeta">${formatters.hr.body(row)}</div>`;
    el.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      selectPersonnel(row.id);
    });
    list.appendChild(el);
  });
}
function selectPersonnel(id) { selectedPersonnelId = id; renderHrList(); renderHrSections(); subscribeHrSection(); }
function getSectionCollectionRef() { return collection(db, 'personnel', selectedPersonnelId, activeHrSection); }
function renderHrSections() {
  const tabs = document.getElementById('hr_section_tabs');
  const detail = document.getElementById('hr_detail');
  const empty = document.getElementById('hr_detail_empty');
  if (!selectedPersonnelId) { detail.classList.add('hidden'); empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden'); detail.classList.remove('hidden');
  tabs.innerHTML = '';
  Object.entries(hrSections).forEach(([key, cfg]) => {
    const btn = document.createElement('button');
    btn.className = `sectionTab ${activeHrSection === key ? 'active' : ''}`;
    btn.textContent = cfg.label;
    btn.onclick = () => { activeHrSection = key; renderHrSections(); subscribeHrSection(); };
    tabs.appendChild(btn);
  });
  hr_section_title.textContent = hrSections[activeHrSection].label;
}
function renderHrSectionList() {
  hr_section_list.innerHTML = '';
  hrSectionRows.forEach((row) => {
    if (activeHrSection === 'ongoingCases') {
      const status = ONGOING_CASE_STATUS_OPTIONS.includes(row.status) ? row.status : 'Open';
      const isOpen = status === 'Open';
      const chargesText = formatChargeCounts(Array.isArray(row.charges) ? row.charges : []);
      const docketMarkup = row.docketLink ? `<a href="${row.docketLink}" target="_blank" rel="noopener noreferrer">View Case</a>` : 'None';
      const el = document.createElement('div');
      el.className = 'recordItem ongoingCaseRow';
      el.innerHTML = `
        <div class="recordHeader">
          <span class="ongoingCaseTitle">#${row.caseNumber || 'None'} State of San Andreas v. ${row.client || 'None'}</span>
          <span class="ongoingCaseStatus">
            <span>${status}</span>
            <span class="statusDot" style="background:${isOpen ? '#22c55e' : '#ef4444'};"></span>
          </span>
        </div>
        <div class="recordMeta">
          <div class="ongoingCaseDetails">
            <div class="ongoingCaseDetailRow"><strong>Charges:</strong> ${chargesText}</div>
            <div class="ongoingCaseDetailRow"><strong>Docket Link:</strong> ${docketMarkup}</div>
            <div class="ongoingCaseDetailRow"><strong>Assigned Attorney:</strong> ${row.assignedAttorney || 'None'}</div>
            <div class="ongoingCaseDetailRow"><strong>Notes:</strong> ${row.notes || 'None'}</div>
          </div>
          <div class="ongoingCaseFooter">
            <div class="ongoingCaseActions">
              <button type="button" class="small" onclick="event.stopPropagation(); openHrRecordModal('${row.id}')">Edit</button>
              <button type="button" class="small danger" onclick="event.stopPropagation(); deleteHrSectionRecord('${row.id}')">Delete</button>
            </div>
          </div>
        </div>`;
      el.addEventListener('click', (event) => {
        if (event.target.closest('button, a')) return;
        el.classList.toggle('expanded');
      });
      hr_section_list.appendChild(el);
      return;
    }
    const title = row.caseNumber || row.trainingName || row.reviewer || row.reason || row.title || row.date || 'Record';
    const meta = Object.entries(row).filter(([k]) => !['id', 'createdAt', 'updatedAt'].includes(k)).map(([k,v]) => `${k}: ${v || 'None'}`).join('\n');
    const el = document.createElement('div');
    el.className = 'recordItem';
    el.innerHTML = `<div class="recordHeader"><span>${title}</span><div><button class="small" onclick="openHrRecordModal('${row.id}')">Edit</button> <button class="small" onclick="deleteHrSectionRecord('${row.id}')">Delete</button></div></div><div class="recordMeta">${meta}</div>`;
    hr_section_list.appendChild(el);
  });
}
function subscribeHrSection() {
  if (!selectedPersonnelId) return;
  onSnapshot(getSectionCollectionRef(), (snapshot) => { hrSectionRows = snapshot.docs.map(d => ({ id: d.id, ...d.data() })); renderHrSectionList(); });
}

async function deleteHrSectionRecord(id) { await deleteDoc(doc(db, 'personnel', selectedPersonnelId, activeHrSection, id)); }

async function deleteHrRecord(id) {
  await deleteDoc(doc(db, 'personnel', id));
}
function openModal(title, fields, values, onSubmit) {
  modalState = { fields, onSubmit };
  modal_title.textContent = title;
  modal_fields.innerHTML = fields.map((field) => {
    const value = values?.[field.key] || '';
    if (field.type === 'textarea') {
      return `<div class="field"><label>${field.label}</label><textarea id="modal_${field.key}" placeholder="${field.label}">${value}</textarea></div>`;
    }
    return `<div class="field"><label>${field.label}</label><input id="modal_${field.key}" value="${value}" placeholder="${field.label}"></div>`;
  }).join('');
  modal_backdrop.classList.remove('hidden');
}
function closeModal() { modal_backdrop.classList.add('hidden'); modalState = null; }

modal_backdrop.addEventListener('click', (event) => {
  if (event.target === modal_backdrop) closeModal();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !modal_backdrop.classList.contains('hidden')) closeModal();
});

async function submitModal() {
  if (!modalState) return;
  const payload = {};
  modalState.fields.forEach((field) => { payload[field.key] = (document.getElementById(`modal_${field.key}`)?.value || '').trim(); });
  await modalState.onSubmit(payload);
  closeModal();
}
function openPersonnelModal(id = '') {
  const current = hrPersonnel.find(p => p.id === id) || {};
  const fields = [{ key:'name', label:'Name' }, { key:'role', label:'Role' }, { key:'phone', label:'Phone' }, { key:'notes', label:'Notes', type:'textarea' }];
  openModal(id ? 'Edit Personnel File' : 'New Personnel File', fields, current, async (data) => {
    if (id) await updateDoc(doc(db, 'personnel', id), { ...data, updatedAt: serverTimestamp() });
    else await addDoc(collection(db, 'personnel'), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  });
}
function openHrRecordModal(id = '') {
  if (!selectedPersonnelId) return;
  const current = hrSectionRows.find(r => r.id === id) || {};
  if (activeHrSection === 'ongoingCases') {
    const attorneys = hrPersonnel.map(p => p.name).filter(Boolean);
    const chargeSelections = Array.isArray(current.charges) ? [...current.charges] : [];
    modalState = {
      fields: [],
      onSubmit: async () => {
        const payload = {
          caseNumber: (document.getElementById('modal_caseNumber').value || '').trim(),
          client: (document.getElementById('modal_client').value || '').trim(),
          charges: [...chargeSelections],
          status: document.getElementById('modal_status').value || 'Open',
          assignedAttorney: document.getElementById('modal_assignedAttorney').value || '',
          docketLink: (document.getElementById('modal_docketLink').value || '').trim(),
          notes: (document.getElementById('modal_notes').value || '').trim()
        };
        if (id) await updateDoc(doc(db, 'personnel', selectedPersonnelId, activeHrSection, id), { ...payload, updatedAt: serverTimestamp() });
        else await addDoc(collection(db, 'personnel', selectedPersonnelId, activeHrSection), { ...payload, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      }
    };
    modal_title.textContent = `${id ? 'Edit' : 'Add'} ${hrSections[activeHrSection].label} Record`;
    modal_fields.innerHTML = `
      <div class="field"><label>Case Number</label><input id="modal_caseNumber" value="${current.caseNumber || ''}" placeholder="26-CM-0005"></div>
      <div class="field"><label>Client</label><input id="modal_client" value="${current.client || ''}" placeholder="Client Name"></div>
      <div class="field"><label>Charges</label><div class="chargeSelector"><div id="modal_charge_modifiers" class="chargeModifiers"></div><input id="modal_chargeSearch" class="chargeSearch" placeholder="Search by code or charge name..."><div id="modal_charges_options" class="chargeList"></div><div id="modal_selected_charges" class="selectedChargeList"></div></div></div>
      <div class="field"><label>Status</label><select id="modal_status">${ONGOING_CASE_STATUS_OPTIONS.map(status => `<option value="${status}" ${current.status === status ? 'selected' : ''}>${status}</option>`).join('')}</select></div>
      <div class="field"><label>Assigned Attorney</label><select id="modal_assignedAttorney"><option value="">Select attorney</option>${attorneys.map(name => `<option value="${name}" ${current.assignedAttorney === name ? 'selected' : ''}>${name}</option>`).join('')}</select></div>
      <div class="field"><label>Docket Link</label><input id="modal_docketLink" value="${current.docketLink || ''}" placeholder="https://..."></div>
      <div class="field"><label>Notes</label><textarea id="modal_notes" placeholder="Notes">${current.notes || ''}</textarea></div>
    `;
    modal_backdrop.classList.remove('hidden');
    const search = document.getElementById('modal_chargeSearch');
    const modifiersContainer = document.getElementById('modal_charge_modifiers');
    const optionsContainer = document.getElementById('modal_charges_options');
    const selectedContainer = document.getElementById('modal_selected_charges');
    const modifierOptions = [
      { id: 'accessory', label: 'Accessory to a Crime' },
      { id: 'attempt', label: 'Attempt of a Crime' },
      { id: 'aggravated', label: 'Aggravated Crime' },
      { id: 'govEmployee', label: 'Crime against a Government Employee' }
    ];
    const activeModifiers = new Set();
    const renderSelectedCharges = () => {
      const entries = Object.values(buildChargeCounts(chargeSelections));
      selectedContainer.innerHTML = entries.length ? entries.map(({ charge, count }) => {
        const key = chargeSelectionKey(charge);
        return `
        <div class="selectedChargeItem">
          <span class="selectedChargeText">${formatChargeSelection(charge)}${count > 1 ? ` (x${count})` : ''}</span>
          <button class="small danger" data-charge-remove="${key}">Remove</button>
        </div>
      `;
      }).join('') : '<div class="recordMeta">None</div>';
      selectedContainer.querySelectorAll('[data-charge-remove]').forEach((btn) => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const key = btn.getAttribute('data-charge-remove');
          const idx = chargeSelections.map(chargeSelectionKey).lastIndexOf(key);
          if (idx >= 0) chargeSelections.splice(idx, 1);
          renderChargeOptions();
          renderSelectedCharges();
        });
      });
    };
    const renderChargeOptions = () => {
      const q = search.value.trim().toLowerCase();
      const grouped = {};
      chargesList.filter((charge) => `${charge.code} ${charge.name}`.toLowerCase().includes(q)).forEach((charge) => {
        const category = getChargeCategory(charge.code);
        if (!grouped[category]) grouped[category] = [];
        grouped[category].push(charge);
      });
      optionsContainer.innerHTML = Object.entries(grouped).map(([category, items]) => `
        <div class="chargeGroup">
          <div class="chargeGroupHeader">${category}</div>
          ${items.map((charge) => `
            <button type="button" class="chargeOption ${chargeSelections.includes(charge.code) ? 'active' : ''}" data-charge-code="${charge.code}">
              <span class="chargeCode">${charge.code}</span>
              <span class="chargeName">${charge.name}</span>
              <i data-lucide="check" class="chargeCheck"></i>
            </button>
          `).join('')}
        </div>
      `).join('') || '<div class="recordMeta">No charges found.</div>';
      optionsContainer.querySelectorAll('[data-charge-code]').forEach((btn) => {
        btn.addEventListener('click', () => {
          chargeSelections.push({ code: btn.getAttribute('data-charge-code'), modifiers: [...activeModifiers] });
          renderChargeOptions();
          renderSelectedCharges();
          if (window.lucide?.createIcons) lucide.createIcons();
        });
      });
      if (window.lucide?.createIcons) lucide.createIcons();
    };

    const renderModifiers = () => {
      modifiersContainer.innerHTML = modifierOptions.map((modifier) => `
        <button type="button" class="chargeModifier ${activeModifiers.has(modifier.id) ? 'active' : ''}" data-modifier-id="${modifier.id}">${modifier.label}</button>
      `).join('');
      modifiersContainer.querySelectorAll('[data-modifier-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-modifier-id');
          if (activeModifiers.has(id)) activeModifiers.delete(id);
          else activeModifiers.add(id);
          renderModifiers();
        });
      });
    };
    search.addEventListener('input', renderChargeOptions);
    renderModifiers();
    renderChargeOptions();
    renderSelectedCharges();
    return;
  }
  const fields = hrSections[activeHrSection].fields.map(key => ({ key, label: key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()) }));
  openModal(`${id ? 'Edit' : 'Add'} ${hrSections[activeHrSection].label} Record`, fields, current, async (data) => {
    if (id) await updateDoc(doc(db, 'personnel', selectedPersonnelId, activeHrSection, id), { ...data, updatedAt: serverTimestamp() });
    else await addDoc(collection(db, 'personnel', selectedPersonnelId, activeHrSection), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  });
}

function subscribePersonnel() {
  onSnapshot(collection(db, 'personnel'), (snapshot) => {
    hrPersonnel = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!selectedPersonnelId && hrPersonnel.length) selectedPersonnelId = hrPersonnel[0].id;
    renderHrList();
    renderHrSections();
  });
}
